version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.13"
    nodejs: "20"
  jobs:
    # Build the interactive React Flow schema diagram bundle into
    # docs/source/_static/ before Sphinx runs (the bundle is git-ignored and
    # regenerated here; the JSON it fetches is generated by conf.py).
    pre_build:
      - npm --prefix diagram-app ci
      - npm --prefix diagram-app run build

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev
        - docs

sphinx:
  # Path to your Sphinx configuration file.
  configuration: docs/source/conf.py